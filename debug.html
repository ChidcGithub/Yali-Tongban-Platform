<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>调试 - 雅礼团委-通办</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"></noscript>
  <link rel="stylesheet" href="/css/material/style.css">
  <link rel="icon" href="/icon/emblem.ico" type="image/x-icon">
  <script src="/version.js"></script>
  <style>
    .set-group { border-bottom: 1px solid var(--md-outline-variant); }
    .set-group:last-child { border-bottom: none; }
    .set-group-header {
      display: flex; align-items: center; gap: 8px;
      padding: 14px 0; cursor: pointer; user-select: none;
      font-size: 1rem; font-weight: 600; color: var(--md-on-surface);
      transition: opacity .2s;
    }
    .set-group-header:hover { opacity: .7; }
    .set-group-header .chevron {
      transition: transform .25s; flex-shrink: 0;
      display: inline-flex; font-size: 1rem;
    }
    .set-group-header.expanded .chevron { transform: rotate(90deg); }
    .set-group-body {
      overflow: hidden; max-height: 0;
      transition: max-height .3s, opacity .25s;
      opacity: 0; padding: 0 0 0 24px;
    }
    .set-group-body.expanded { max-height: 400px; opacity: 1; padding-bottom: 16px; }
    .dbg-entry { padding: 6px 0; font-size: .85rem; border-bottom: 1px solid var(--md-outline-variant); display: flex; gap: 8px; }
    .dbg-entry:last-child { border-bottom: none; }
    .dbg-key { color: var(--md-primary); font-weight: 500; white-space: nowrap; min-width: 140px; flex-shrink: 0; }
    .dbg-val { color: var(--md-on-surface); word-break: break-all; font-family: "Cascadia Code", "Fira Code", "Consolas", monospace; font-size: .82rem; }
  </style>
</head>
<body>
  <div id="sco" style="position:fixed;inset:0;z-index:99999;background:var(--md-primary);opacity:0;pointer-events:none;transition:opacity .2s"></div>
  <script src="/js/modal.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script>
    renderNav('debug');
    checkSiteClosed();
    (async () => {
      const user = await requireAuth();
      if (!user) return;

      function mask(val) {
        const s = String(val);
        if (!s || s.length <= 6) return "***";
        return s.slice(0, 3) + "****" + s.slice(-3);
      }

      function entry(key, val, showRaw = false) {
        return `<div class="dbg-entry"><span class="dbg-key">${key}</span><span class="dbg-val">${escapeHtml(showRaw ? val : mask(val))}</span></div>`;
      }

      function rawEntry(key, val) {
        return `<div class="dbg-entry"><span class="dbg-key">${key}</span><span class="dbg-val">${escapeHtml(String(val))}</span></div>`;
      }

      function section(title, content) {
        return `<div class="set-group"><div class="set-group-header" onclick="toggleSetting(this)"><span class="chevron"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>${title}</div><div class="set-group-body">${content}</div></div>`;
      }

      window.toggleSetting = function(header) {
        const body = header.nextElementSibling;
        const expanded = body.classList.toggle("expanded");
        header.classList.toggle("expanded", expanded);
        body.style.maxHeight = expanded ? body.scrollHeight + "px" : "0";
        body.style.opacity = expanded ? "1" : "0";
      }

      // ── collect data ──
      const renderTarget = document.getElementById("dbgContent");

      // Cookie
      let cookieContent = "";
      if (document.cookie) {
        document.cookie.split(";").forEach(c => {
          const eq = c.indexOf("=");
          if (eq > 0) {
            const k = c.slice(0, eq).trim();
            const rawVal = c.slice(eq + 1).trim();
            cookieContent += entry(k, rawVal, false);
          }
        });
      } else {
        cookieContent = rawEntry("(empty)", "无 Cookie");
      }
      cookieContent += rawEntry("Raw", document.cookie);

      // Navigator
      const nav = navigator;
      let navContent = "";
      navContent += rawEntry("userAgent", nav.userAgent);
      navContent += rawEntry("platform", nav.platform);
      navContent += rawEntry("language", nav.language);
      navContent += rawEntry("languages", nav.languages?.join(", ") || "");
      navContent += rawEntry("cookieEnabled", nav.cookieEnabled);
      navContent += rawEntry("hardwareConcurrency", nav.hardwareConcurrency);
      navContent += rawEntry("deviceMemory", nav.deviceMemory);
      navContent += rawEntry("maxTouchPoints", nav.maxTouchPoints);
      navContent += rawEntry("vendor", nav.vendor);
      navContent += rawEntry("appVersion", nav.appVersion);
      navContent += rawEntry("appName", nav.appName);
      navContent += rawEntry("onLine", nav.onLine);
      if (nav.connection) {
        navContent += rawEntry("connection.effectiveType", nav.connection.effectiveType);
        navContent += rawEntry("connection.rtt", nav.connection.rtt + "ms");
        navContent += rawEntry("connection.downlink", nav.connection.downlink + "Mbps");
      }

      // Screen
      const sc = screen;
      let scContent = "";
      scContent += rawEntry("width", sc.width);
      scContent += rawEntry("height", sc.height);
      scContent += rawEntry("availWidth", sc.availWidth);
      scContent += rawEntry("availHeight", sc.availHeight);
      scContent += rawEntry("colorDepth", sc.colorDepth);
      scContent += rawEntry("pixelDepth", sc.pixelDepth);
      scContent += rawEntry("orientation", sc.orientation?.type || "N/A");

      // Location
      const loc = location;
      let locContent = "";
      locContent += rawEntry("href", loc.href);
      locContent += rawEntry("origin", loc.origin);
      locContent += rawEntry("protocol", loc.protocol);
      locContent += rawEntry("host", loc.host);
      locContent += rawEntry("hostname", loc.hostname);
      locContent += rawEntry("port", loc.port);
      locContent += rawEntry("pathname", loc.pathname);
      locContent += rawEntry("search", loc.search);
      locContent += rawEntry("hash", loc.hash);

      // Storage
      let lsContent = "";
      if (localStorage.length) {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          const v = localStorage.getItem(k);
          lsContent += entry(k, v, false);
        }
      } else {
        lsContent += rawEntry("(empty)", "无 localStorage 数据");
      }
      let ssContent = "";
      if (sessionStorage.length) {
        for (let i = 0; i < sessionStorage.length; i++) {
          const k = sessionStorage.key(i);
          const v = sessionStorage.getItem(k);
          ssContent += entry(k, v, false);
        }
      } else {
        ssContent += rawEntry("(empty)", "无 sessionStorage 数据");
      }

      // Performance
      const perf = performance;
      let perfContent = "";
      if (perf.memory) {
        perfContent += rawEntry("memory.jsHeapSizeLimit", Math.round(perf.memory.jsHeapSizeLimit / 1048576) + " MB");
        perfContent += rawEntry("memory.totalJSHeapSize", Math.round(perf.memory.totalJSHeapSize / 1048576) + " MB");
        perfContent += rawEntry("memory.usedJSHeapSize", Math.round(perf.memory.usedJSHeapSize / 1048576) + " MB");
      }
      perfContent += rawEntry("timing.domComplete", perf.timing?.domComplete ? new Date(perf.timing.domComplete).toISOString() : "N/A");

      // Window
      const w = window;
      let winContent = "";
      winContent += rawEntry("innerWidth", w.innerWidth);
      winContent += rawEntry("innerHeight", w.innerHeight);
      winContent += rawEntry("outerWidth", w.outerWidth);
      winContent += rawEntry("outerHeight", w.outerHeight);
      winContent += rawEntry("devicePixelRatio", w.devicePixelRatio);
      winContent += rawEntry("screenX", w.screenX);
      winContent += rawEntry("screenY", w.screenY);

      // Time
      let timeContent = "";
      timeContent += rawEntry("DateTime", new Date().toISOString());
      timeContent += rawEntry("TimeZone", Intl.DateTimeFormat().resolvedOptions().timeZone);
      timeContent += rawEntry("TimezoneOffset", new Date().getTimezoneOffset() + " min");

      // Battery
      let battContent = "";
      if (navigator.getBattery) {
        try {
          const b = await navigator.getBattery();
          battContent += rawEntry("level", Math.round(b.level * 100) + "%");
          battContent += rawEntry("charging", b.charging);
          battContent += rawEntry("chargingTime", b.chargingTime === Infinity ? "∞" : b.chargingTime + "s");
          battContent += rawEntry("dischargingTime", b.dischargingTime === Infinity ? "∞" : b.dischargingTime + "s");
        } catch {}
      }
      if (!battContent) battContent = rawEntry("(unavailable)", "电池 API 不可用");

      // ── render ──
      renderTarget.innerHTML =
        section("Cookie", cookieContent) +
        section("Navigator", navContent) +
        section("Screen", scContent) +
        section("Location", locContent) +
        section("localStorage", lsContent) +
        section("sessionStorage", ssContent) +
        section("Performance", perfContent) +
        section("Window", winContent) +
        section("Time", timeContent) +
        section("Battery", battContent) +
        section("App", rawEntry("Website Version", APP_VERSION) + rawEntry("Deployment Time", APP_DEPLOYED));
    })();
  </script>
  <div class="container">
    <div class="page-header">
      <h1>调试</h1>
      <p>浏览器环境与计算机数据</p>
    </div>
    <div class="card" style="padding:16px 24px" id="dbgContent">
    </div>
  </div>
</body>
</html>
