<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>值日 - 雅礼团委-通办</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"></noscript>
  <link rel="stylesheet" href="/css/material/style.css">
  <link rel="icon" href="/icon/emblem.ico" type="image/x-icon">
</head>
<body>
  <div id="sco" style="position:fixed;inset:0;z-index:99999;background:var(--md-primary);opacity:0;pointer-events:none;transition:opacity .2s"></div>
  <script src="/js/modal.js"></script>
  <script src="/js/api.js"></script>
  <script src="/version.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script>renderNav('duty');checkSiteClosed();</script>
  <div class="container">
    <div class="page-header">
      <h1>值日</h1>
      <p>值日签到系统</p>
    </div>
    <div id="dutyDashboard">
      <!-- 加载占位：骨架屏扫光，数据返回后被 JS 渲染结果整体替换 -->
      <div class="card g-skeleton" aria-hidden="true">
        <div class="g-skeleton-line" style="width:36%;height:12px"></div>
        <div class="g-skeleton-line" style="width:58%;height:22px;border-radius:999px"></div>
      </div>
      <div class="card g-skeleton" aria-hidden="true">
        <div style="display:grid;grid-template-columns:90px 1fr 1fr auto;gap:10px;align-items:center;padding:8px 0 10px;border-bottom:1px solid var(--md-outline-variant)">
          <div class="g-skeleton-line" style="width:70%;height:12px;margin:0"></div>
          <div class="g-skeleton-line" style="width:55%;height:12px;margin:0 auto"></div>
          <div class="g-skeleton-line" style="width:55%;height:12px;margin:0 auto"></div>
          <div class="g-skeleton-line" style="width:46px;height:12px;margin:0 0 0 auto"></div>
        </div>
        <div style="display:grid;grid-template-columns:90px 1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--md-outline-variant)">
          <div class="g-skeleton-line" style="width:62%;height:12px;margin:0"></div>
          <div class="g-skeleton-line" style="width:74%;height:34px;margin:0 auto;border-radius:var(--md-shape-sm)"></div>
          <div class="g-skeleton-line" style="width:74%;height:34px;margin:0 auto;border-radius:var(--md-shape-sm)"></div>
          <div class="g-skeleton-line" style="width:40px;height:12px;margin:0 0 0 auto"></div>
        </div>
        <div style="display:grid;grid-template-columns:90px 1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--md-outline-variant)">
          <div class="g-skeleton-line" style="width:58%;height:12px;margin:0"></div>
          <div class="g-skeleton-line" style="width:70%;height:34px;margin:0 auto;border-radius:var(--md-shape-sm)"></div>
          <div class="g-skeleton-line" style="width:70%;height:34px;margin:0 auto;border-radius:var(--md-shape-sm)"></div>
          <div class="g-skeleton-line" style="width:40px;height:12px;margin:0 0 0 auto"></div>
        </div>
        <div style="display:grid;grid-template-columns:90px 1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--md-outline-variant)">
          <div class="g-skeleton-line" style="width:66%;height:12px;margin:0"></div>
          <div class="g-skeleton-line" style="width:66%;height:34px;margin:0 auto;border-radius:var(--md-shape-sm)"></div>
          <div class="g-skeleton-line" style="width:66%;height:34px;margin:0 auto;border-radius:var(--md-shape-sm)"></div>
          <div class="g-skeleton-line" style="width:40px;height:12px;margin:0 0 0 auto"></div>
        </div>
        <div style="display:grid;grid-template-columns:90px 1fr 1fr auto;gap:10px;align-items:center;padding:10px 0 2px">
          <div class="g-skeleton-line" style="width:52%;height:12px;margin:0"></div>
          <div class="g-skeleton-line" style="width:64%;height:34px;margin:0 auto;border-radius:var(--md-shape-sm)"></div>
          <div class="g-skeleton-line" style="width:64%;height:34px;margin:0 auto;border-radius:var(--md-shape-sm)"></div>
          <div class="g-skeleton-line" style="width:40px;height:12px;margin:0 0 0 auto"></div>
        </div>
      </div>
    </div>
    <div class="section" id="publicDeptStatsSection" style="margin-top:20px">
      <div class="section-title">部门扣分统计（近两周）</div>
      <div id="publicDeptStats">
        <div class="dept-stats" aria-hidden="true">
          <div class="g-skeleton-line" style="width:92%;height:16px;margin:0 auto"></div>
          <div class="g-skeleton-line" style="width:84%;height:16px;margin:0 auto"></div>
          <div class="g-skeleton-line" style="width:88%;height:16px;margin:0 auto"></div>
          <div class="g-skeleton-line" style="width:70%;height:16px;margin:0 auto"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/duty.js"></script>
</body>
</html>
