<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>服务 - 雅礼团委-通办</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"></noscript>
  <link rel="stylesheet" href="/css/material/style.css">
  <link rel="icon" href="/icon/emblem.ico" type="image/x-icon">
</head>
<body>
  <div id="sco" style="position:fixed;inset:0;z-index:99999;background:var(--md-primary);opacity:0;pointer-events:none;transition:opacity .2s"></div>
  <script src="/js/captcha.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    renderNav('services');
    checkSiteClosed();
    checkAuth();
  </script>

  <div class="container">
    <div class="page-header">
      <h1>服务</h1>
      <p>提交报修问题或反馈，无需登录即可提交</p>
    </div>

    <!-- 最新公告 -->
    <div id="announceBanner" class="announce-banner" style="display:none"></div>

    <!-- 问题反馈区 -->
    <div class="section">
      <div class="section-title">
        <span>问题反馈</span>
        <div class="filter-tabs" id="filterTabs">
          <button class="tab-btn filter-tab active" data-filter="all" onclick="setFilter('all')">全部</button>
          <button class="tab-btn filter-tab" data-filter="待处理" onclick="setFilter('待处理')">待处理</button>
          <button class="tab-btn filter-tab" data-filter="处理中" onclick="setFilter('处理中')">处理中</button>
          <button class="tab-btn filter-tab" data-filter="已完成" onclick="setFilter('已完成')">已完成</button>
        </div>
      </div>
      <div id="issueList" class="card">
        <!-- 加载占位：骨架屏扫光，数据返回后被 JS 渲染结果替换 -->
        <div class="g-skeleton" aria-hidden="true">
          <div class="g-skeleton-line" style="width:52%;height:17px"></div>
          <div class="g-skeleton-line" style="width:90%"></div>
          <div class="g-skeleton-line" style="width:75%"></div>
          <div class="g-skeleton-line" style="width:30%;height:12px;margin-top:14px"></div>
        </div>
        <div class="g-skeleton" aria-hidden="true" style="margin-top:20px">
          <div class="g-skeleton-line" style="width:46%;height:17px"></div>
          <div class="g-skeleton-line" style="width:94%"></div>
          <div class="g-skeleton-line" style="width:68%"></div>
          <div class="g-skeleton-line" style="width:26%;height:12px;margin-top:14px"></div>
        </div>
        <div class="g-skeleton" aria-hidden="true" style="margin-top:20px">
          <div class="g-skeleton-line" style="width:58%;height:17px"></div>
          <div class="g-skeleton-line" style="width:86%"></div>
          <div class="g-skeleton-line" style="width:72%"></div>
          <div class="g-skeleton-line" style="width:34%;height:12px;margin-top:14px"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/lightbox.js"></script>
  <script src="/js/services.js"></script>
  <!-- 浮动加号按钮 -->
  <button class="fab" id="fabBtn" onclick="openIssueModal()" aria-label="提交问题">+</button>
</body>
</html>
