<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>值日管理 - 雅礼团委-通办</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap"></noscript>
  <link rel="stylesheet" href="/css/material/style.css">
  <link rel="icon" href="/icon/emblem.ico" type="image/x-icon">
</head>
<body>
  <div id="sco" style="position:fixed;inset:0;z-index:99999;background:var(--md-primary);opacity:0;pointer-events:none;transition:opacity .2s"></div>
  <script src="/js/modal.js"></script>
  <script src="/js/api.js"></script>
  <script src="/version.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/nav.js"></script>
  <script>renderNav('duty');checkSiteClosed();</script>
  <div class="container">
    <div class="page-header">
      <h1>值日管理</h1>
      <p>干事名单 · 排班生成 · 扣分管理</p>
    </div>

    <!-- Staff Management -->
    <div class="section">
      <div class="section-title">干事名单</div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">
        <button class="btn btn-sm btn-primary" onclick="showUploadModal()"><span data-icon="upload"></span> 上传干事表</button>
        <button class="btn btn-sm btn-primary" onclick="showAddStaffModal()"><span data-icon="user-plus"></span> 添加干事</button>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:4px">
        <span id="staffCount" style="font-size:.88rem;color:var(--md-on-surface-variant)"></span>
        <button class="btn btn-sm btn-outline" onclick="showStaffModal()"><span data-icon="users"></span> 查看名单</button>
      </div>
    </div>

    <!-- Schedule -->
    <div class="section">
      <div class="section-title">排班管理</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="prevMonth()"><span data-icon="chevron-left"></span></button>
        <span class="cal-nav-title" id="calTitle"></span>
        <button class="cal-nav-btn" onclick="nextMonth()"><span data-icon="chevron-right"></span></button>
      </div>
      <div id="adminScheduleList">
        <!-- 加载占位：骨架屏扫光，数据返回后被 JS 渲染结果整体替换 -->
        <div class="card g-skeleton" aria-hidden="true" style="padding:12px">
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px">
            <div class="g-skeleton-line" style="width:50%;height:10px;margin:0 auto"></div>
            <div class="g-skeleton-line" style="width:50%;height:10px;margin:0 auto"></div>
            <div class="g-skeleton-line" style="width:50%;height:10px;margin:0 auto"></div>
            <div class="g-skeleton-line" style="width:50%;height:10px;margin:0 auto"></div>
            <div class="g-skeleton-line" style="width:50%;height:10px;margin:0 auto"></div>
            <div class="g-skeleton-line" style="width:50%;height:10px;margin:0 auto"></div>
            <div class="g-skeleton-line" style="width:50%;height:10px;margin:0 auto"></div>
          </div>
          <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
            <div class="g-skeleton-line" style="width:100%;height:auto;aspect-ratio:1/1;margin:0;border-radius:var(--md-shape-md)"></div>
          </div>
        </div>
      </div>
      <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;align-items:center">
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-sm btn-primary" id="genScheduleBtn" onclick="generateSchedule()"><span data-icon="refresh"></span> 自动生成</button>
          <button class="btn btn-sm btn-outline" onclick="showExportTimePicker('schedule')"><span data-icon="file-text"></span> 导出排班</button>
        </div>
        <button class="btn btn-sm btn-danger-outline" onclick="clearAllSchedules()" style="margin-left:auto"><span data-icon="trash-2"></span> 重置排班数据</button>
      </div>
    </div>

    <!-- Score Records -->
    <div class="section">
      <div class="section-title">扣分记录</div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <span id="scoreCount" style="font-size:.88rem;color:var(--md-on-surface-variant)"></span>
        <button class="btn btn-sm btn-primary" onclick="showAddScoreModal()"><span data-icon="alert-triangle"></span> 手动扣分</button>
        <button class="btn btn-sm btn-outline" onclick="showScoresModal()"><span data-icon="file-text"></span> 查看扣分</button>
        <button class="btn btn-sm btn-outline" onclick="showExportTimePicker('scores')"><span data-icon="download"></span> 导出扣分</button>
      </div>
    </div>

    <!-- Department Stats -->
    <div class="section">
      <div class="section-title">部门扣分统计（近两周）</div>
      <div id="deptStatsContainer">
        <!-- 加载占位：骨架屏扫光，数据返回后被 JS 渲染结果整体替换 -->
        <div class="dept-stats" aria-hidden="true">
          <div class="g-skeleton-line" style="width:92%;height:16px;margin:0 auto"></div>
          <div class="g-skeleton-line" style="width:84%;height:16px;margin:0 auto"></div>
          <div class="g-skeleton-line" style="width:88%;height:16px;margin:0 auto"></div>
          <div class="g-skeleton-line" style="width:70%;height:16px;margin:0 auto"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Upload Modal -->
  <div class="modal-overlay" id="uploadModal" style="display:none" onclick="closeUploadModal(event)">
    <div class="modal" style="max-width:500px">
      <div class="modal-header">
        <strong>上传干事表</strong>
      </div>
      <form onsubmit="handleUpload(event)">
        <div class="modal-body">
          <p style="font-size:.85rem;color:var(--md-on-surface-variant);margin-bottom:12px">格式：每行 <code>部门,班级,姓名</code>，用逗号分隔</p>
          <textarea class="form-textarea" name="csv" rows="8" placeholder="办公室,2501,张三&#10;办公室,2502,李四" required style="font-family:monospace;font-size:.82rem"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost btn-sm" onclick="closeUploadModal()">取消</button>
          <button type="submit" class="btn btn-primary btn-sm">导入</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Staff Modal -->
  <div class="modal-overlay" id="staffModal" style="display:none" onclick="closeStaffModal(event)">
    <div class="modal" style="max-width:520px">
      <div class="modal-header">
        <strong>干事名单</strong>
      </div>
      <div class="modal-body" id="staffModalBody" style="max-height:60vh;overflow-y:auto;padding:0"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeStaffModal()">关闭</button>
      </div>
    </div>
  </div>

  <!-- Add Staff Modal -->
  <div class="modal-overlay" id="addStaffModal" style="display:none" onclick="closeAddStaffModal(event)">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <strong>添加干事</strong>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">部门</label>
          <input class="form-input" id="modalStaffDept" placeholder="办公室">
        </div>
        <div class="form-group">
          <label class="form-label">班级</label>
          <input class="form-input" id="modalStaffClass" placeholder="2501">
        </div>
        <div class="form-group">
          <label class="form-label">姓名</label>
          <input class="form-input" id="modalStaffName" placeholder="张三">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeAddStaffModal()">取消</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="submitAddStaff()">添加</button>
      </div>
    </div>
  </div>

  <!-- Schedule Modal -->
  <div class="modal-overlay" id="scheduleModal" style="display:none" onclick="closeScheduleModal(event)">
    <div class="modal" style="max-width:420px">
      <div class="modal-header">
        <strong>手动排班</strong>
      </div>
      <div class="modal-body">
        <p style="font-size:.9rem;font-weight:500;margin-bottom:16px" id="scheduleModalDate"></p>
        <div class="form-group">
          <label class="form-label">干事 A</label>
          <select class="form-input" id="scheduleStaffA"></select>
        </div>
        <div class="form-group">
          <label class="form-label">干事 B</label>
          <select class="form-input" id="scheduleStaffB"></select>
        </div>
      </div>
      <div class="modal-footer" style="justify-content:space-between">
        <button type="button" class="btn btn-sm btn-danger-outline" id="scheduleDeleteBtn" style="display:none" onclick="deleteManualSchedule()"><span data-icon="trash-2"></span> 删除排班</button>
        <div style="display:flex;gap:8px">
          <button type="button" class="btn btn-ghost btn-sm" onclick="closeScheduleModal()">取消</button>
          <button type="button" class="btn btn-primary btn-sm" onclick="saveManualSchedule()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scores Modal -->
  <div class="modal-overlay" id="scoresModal" style="display:none" onclick="closeScoresModal(event)">
    <div class="modal" style="max-width:680px">
      <div class="modal-header">
        <strong>扣分记录</strong>
        <span id="scoreStatsSummary" style="font-size:.8rem;color:var(--md-on-surface-variant);margin-left:auto"></span>
      </div>
      <div class="modal-body" style="padding:12px 16px;max-height:60vh;overflow-y:auto">
        <!-- 筛选栏 -->
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
          <select class="form-input" id="scoreFilterDept" onchange="applyScoreFilter()" style="padding:4px 8px;font-size:.82rem;flex:1;min-width:120px">
            <option value="">全部部门</option>
          </select>
          <select class="form-input" id="scoreFilterCancelled" onchange="applyScoreFilter()" style="padding:4px 8px;font-size:.82rem">
            <option value="all">全部状态</option>
            <option value="active" selected>仅有效</option>
            <option value="cancelled">仅已销分</option>
          </select>
          <input class="form-input" id="scoreFilterName" placeholder="搜索姓名" oninput="applyScoreFilter()" style="padding:4px 8px;font-size:.82rem;min-width:100px">
        </div>
        <!-- 批量操作栏 -->
        <div id="scoreBatchBar" style="display:none;align-items:center;gap:8px;margin-bottom:8px;padding:8px;background:var(--md-surface-container);border-radius:var(--md-shape-sm)">
          <span id="scoreSelectedCount" style="font-size:.82rem;color:var(--md-on-surface-variant)"></span>
          <button class="btn btn-xs btn-danger-outline" onclick="showBatchCancelModal()"><span data-icon="check-circle"></span> 批量销分</button>
          <button class="btn btn-xs btn-text" onclick="clearScoreSelection()">取消选择</button>
        </div>
        <div id="scoresModalBody"></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeScoresModal()">关闭</button>
      </div>
    </div>
  </div>

  <!-- Add Score Modal -->
  <div class="modal-overlay" id="addScoreModal" style="display:none" onclick="closeAddScoreModal(event)">
    <div class="modal" style="max-width:440px">
      <div class="modal-header">
        <strong>手动扣分</strong>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">干事 <span class="required">*</span></label>
          <select class="form-input" id="addScoreStaff" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">日期 <span class="required">*</span></label>
          <input class="form-input" type="date" id="addScoreDate" required>
        </div>
        <div class="form-group">
          <label class="form-label">时段 <span class="required">*</span></label>
          <select class="form-input" id="addScorePeriod" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">分值 <span class="required">*</span></label>
          <input class="form-input" type="number" id="addScoreValue" step="0.5" placeholder="如 -1（扣分）或 +1（加分）" required>
        </div>
        <div class="form-group">
          <label class="form-label">原因</label>
          <input class="form-input" id="addScoreReason" placeholder="如：缺岗、迟到、表现优秀" maxlength="200">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeAddScoreModal()">取消</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="submitAddScore()">提交</button>
      </div>
    </div>
  </div>

  <!-- Batch Cancel Modal -->
  <div class="modal-overlay" id="batchCancelModal" style="display:none" onclick="closeBatchCancelModal(event)">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <strong>批量销分</strong>
      </div>
      <div class="modal-body">
        <p id="batchCancelHint" style="font-size:.85rem;color:var(--md-on-surface-variant);margin-bottom:12px"></p>
        <div class="form-group">
          <label class="form-label">销分理由 <span class="required">*</span></label>
          <input class="form-input" id="batchCancelReason" placeholder="请输入销分理由" maxlength="200">
        </div>
        <div class="form-group">
          <label class="form-label">销分人 <span class="required">*</span></label>
          <select class="form-input" id="batchCancelAdminSelect">
            <option value="">-- 选择管理员 --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">密码 <span class="required">*</span></label>
          <input class="form-input" type="password" id="batchCancelPassword" placeholder="输入销分人密码">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeBatchCancelModal()">取消</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="submitBatchCancel()">确认销分</button>
      </div>
    </div>
  </div>

  <!-- Cancel Modal -->
  <div class="modal-overlay" id="cancelModal" style="display:none" onclick="closeCancelModal(event)">
    <div class="modal" style="max-width:400px">
      <div class="modal-header">
        <strong>申请销分</strong>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">销分理由 <span class="required">*</span></label>
          <input class="form-input" id="cancelReason" placeholder="请输入销分理由" maxlength="200">
        </div>
        <div class="form-group">
          <label class="form-label">销分人 <span class="required">*</span></label>
          <select class="form-input" id="cancelAdminSelect">
            <option value="">-- 选择管理员 --</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">密码 <span class="required">*</span></label>
          <input class="form-input" type="password" id="cancelPassword" placeholder="输入销分人密码">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost btn-sm" onclick="closeCancelModal()">取消</button>
        <button type="button" class="btn btn-primary btn-sm" onclick="submitCancel()">提交销分</button>
      </div>
    </div>
  </div>

  <script>document.querySelectorAll('[data-icon]').forEach(function(e){e.innerHTML=icon(e.getAttribute('data-icon'))})</script>
  <script src="/js/duty-admin.js"></script>
</body>
</html>
